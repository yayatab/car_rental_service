services:
  mysql:
    image: mysql:latest
    container_name: db-mysql
    environment:
      MYSQL_DATABASE: rental_service
      MYSQL_USER: rental_shop
      MYSQL_PASSWORD: rental_shop #in real world application - use hashicorp or env var/helm chart
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro




volumes:
  mysql_data: